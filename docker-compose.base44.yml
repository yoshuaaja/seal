services:
  web:
    image: node:22-slim
    working_dir: /app/examples/frontend
    volumes:
      - ./examples/frontend:/app/examples/frontend
      - frontend_node_modules:/app/examples/frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    command:
      [
        "sh",
        "-ec",
        "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && exec pnpm dev --host 0.0.0.0 --port 3000",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  frontend_node_modules:
